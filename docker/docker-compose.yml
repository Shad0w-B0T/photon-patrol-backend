version: "3.8"
services:
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: photon-rabbitmq
    restart: unless-stopped
    build:
      context: file/
    ports:
      - "1883:1883"
      - "5672:5672"
      - "8080:15672"
      - "1885:15675"
    command: "/bin/bash -c \"rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt rabbitmq_amqp1_0; rabbitmq-server\""
    env_file:
      - env/rabbit.env
    networks:
      - photon-testnet
    volumes:
      - type: bind
        source: ./config/rabbitmq/rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
        read_only: true
      - type: bind
        source: ./config/rabbitmq/advanced.config
        target: /etc/rabbitmq/advanced.config
        read_only: true
  postgres:
    image: postgres:latest
    container_name: photon-postgres
    ports:
      - "5432:5432"
    env_file:
      - env/postgres.env
    networks:
      - photon-testnet
  influx:
    image: influxdb:2
    container_name: photon-influx
    ports:
      - "8086:8086"
    env_file:
      - env/influx.env
    networks:
      - photon-testnet
  nginx:
    image: nginx:stable-bullseye-perl
    container_name: photon-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - photon-testnet
    #depends_on:
    #  - frontend
    #  - backend


networks:
  photon-testnet:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      driver: default
      config:
        - subnet: 172.16.238.0/24