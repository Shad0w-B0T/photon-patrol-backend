# --- Logger
logging.level.root                        =INFO

# --- Sql configuration ---
spring.datasource.url                     =jdbc:postgresql://localhost:5432/postgres
spring.datasource.username                =postgres
spring.datasource.password                =test

# --- Hibernate configuration
spring.jpa.properties.hibernate.dialect   =org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql                       =false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto             =update
spring.jpa.defer-datasource-initialization=true

# --- RabbitMq Configure data
application.rabbit.uri                    =amqp://user:password@localhost:5672/icarus
application.rabbit.exchange               =photon_broadcast
application.rabbit.queue                  =photon_broadcast_channel
application.rabbit.key                    =