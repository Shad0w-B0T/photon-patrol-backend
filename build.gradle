plugins {
  id 'java-library'
  alias(libs.plugins.lombok)
  alias(libs.plugins.owasp)
}

group = 'de.hdm'
version = '1.0.2'

/**
 * Configure for all sub projects.*/
allprojects {
  apply plugin: 'java-library'
  apply plugin: libs.plugins.lombok.get().pluginId

  compileJava {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  repositories {
    mavenCentral()
  }

  dependencies {
    //Annotations
    implementation libs.annotations
    implementation libs.log4j

    implementation libs.spring.doc
    testImplementation libs.spring.doc

    //Junit
    testImplementation libs.junit.jupiter.api
    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.jupiter.engine

  }

  test {
    useJUnitPlatform()
  }
}

/**
 * Configuration of owasp.
 */
dependencyCheck {
  //failBuildOnCVSS = -1
  //suppressionFile = "dependency-check-suppressions.xml"
  format = "ALL"
  outputDirectory = "build/reports/"
}

/**
 * Collect all java docs.
 */
task aggregateJavadocs(type: Javadoc) {
  description = 'Generates aggregated Javadocs for all modules.'
  destinationDir = file("${buildDir}/docs/javadoc")

  // Include source
  source = files(subprojects.collect { it.sourceSets.main.allJava })
  classpath = files(subprojects.collect { it.sourceSets.main.compileClasspath })

  options {
    title = 'Aggregated Javadoc'
    windowTitle = 'Aggregated Javadoc'
  }
}

subprojects {
  tasks.withType(Javadoc) {
    enabled = false // Disable individual Javadocs generation
  }
}