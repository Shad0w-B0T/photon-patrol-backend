plugins {
  id 'java'
}

group = 'de.hdm'
version = '1.0.0'

repositories {
  mavenCentral()
}

dependencies {
  implementation project(":photon-schema")
  implementation project(":photon-database")
  implementation project(":photon-logic")

  //Spring
  implementation libs.spring.boot.starter.parent
  implementation libs.spring.boot.starter.web
  implementation libs.spring.boot.autoconfigure
  implementation libs.spring.boot.starter.data.jpa
  implementation libs.spring.boot.starter.security

  testImplementation project(":photon-schema")
  testImplementation project(":photon-database")
  testImplementation project(":photon-logic")

  //#-------- Tests
  testImplementation project(":photon-schema")
  testImplementation project(":photon-database")
  testImplementation project(":photon-logic")
  testImplementation project(":test-photon-environment")

  //Spring
  testImplementation libs.spring.boot.autoconfigure
  testImplementation libs.spring.boot.starter.data.jpa
  testImplementation libs.spring.boot.starter.test

  //Data
  testImplementation libs.hikari
  testImplementation libs.postgresql
  testImplementation libs.database.influxdb
}

test {
  useJUnitPlatform()
}