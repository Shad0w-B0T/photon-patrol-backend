server.port                               =80

# --- Logger ---
logging.level.root                        =INFO

# --- Sql configuration ---
spring.datasource.url                     =jdbc:postgresql://localhost:5432/postgres
spring.datasource.username                =postgres
spring.datasource.password                =test

# --- Hibernate configuration
spring.jpa.properties.hibernate.dialect   =org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql                       =false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto             =update
spring.jpa.defer-datasource-initialization=true

# --- Swagger
springdoc.swagger-ui.path                 =/doc
springdoc.swagger-ui.operationsSorter     =alpha
springdoc.swagger-ui.tagsSorter           =alpha

study.web.swagger.title                   =Photon Patrol API
study.web.swagger.description             =On this page, all available interfaces and object structures are listed with examples. It is important to note that this page is only active if it has been authorised by the backend. Authorisation is deactivated for this area, so the requests can be selected as required.
study.web.swagger.version                 =1.0

# --- Application Configure
# Time of heartbeat in seconds.
application.heartbeat.delay               =50
application.security.active               =false
application.security.username             =photon

# --- InfluxDB
application.influxdb.url                  =http://localhost:8086
application.influxdb.user                 =my-user
application.influxdb.password             =my-super-secret-auth-token
application.influxdb.database             =my-bucket