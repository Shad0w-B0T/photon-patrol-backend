plugins {
    id 'java'
}

group = 'de.hdm-stuttgart'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {

  testImplementation project(":test-photon-environment")

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}