image: gradle:jdk17-alpine

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

services:
  - postgres:latest
  - influxdb:2
  - rabbitmq:management-alpine

variables:
  PHOTON_TEST_CONTAINERS: true
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: test
  DOCKER_INFLUXDB_INIT_MODE: setup
  DOCKER_INFLUXDB_INIT_USERNAME: my-user
  DOCKER_INFLUXDB_INIT_PASSWORD: my-password
  DOCKER_INFLUXDB_INIT_ORG: my-org
  DOCKER_INFLUXDB_INIT_BUCKET: my-bucket
  DOCKER_INFLUXDB_INIT_RETENTION: 1w
  DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
  RABBITMQ_DEFAULT_USER: admin
  RABBITMQ_DEFAULT_PASS: instar

stages:
  - build
  - test
  - update
  - security
  - docs
  - package
  - deploy

before_script:
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME
  - chmod +x gradlew

build:
  stage: build
  script: gradle --build-cache assemble
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

test:
  stage: test
  script: gradle check
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle
  artifacts:
    reports:
      junit: '**/build/test-results/test/*.xml'
    when: always

docs:
  stage: docs
  script: gradle aggregateJavadocs
  artifacts:
    paths:
      - build/docs/javadoc
  only:
    - master
    - development

build-applications:
  stage: package
  script:
    - ./gradlew :photon-webserver-application:assemble
    - ./gradlew :photon-queue-application:assemble
  artifacts:
    paths:
      - photon-webserver-application/build/libs/*.jar
      - photon-queue-application/build/libs/*.jar
  only:
    - master
    - development

pages:
  stage: deploy
  script:
    - mv build/docs/javadoc public
  artifacts:
    paths:
      - public
  only:
    - master
    - development



