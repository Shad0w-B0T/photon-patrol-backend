[libraries]
annotations = "org.jetbrains:annotations:24.0.1"
log4j = "org.apache.logging.log4j:log4j-core:2.20.0"

spring-boot-starter-parent = "org.springframework.boot:spring-boot-starter-parent:3.3.2"
spring-boot-starter-web = "org.springframework.boot:spring-boot-starter-web:3.3.2"
spring-boot-starter-webflux = "org.springframework.boot:spring-boot-starter-webflux:3.3.2"
spring-boot-autoconfigure = "org.springframework.boot:spring-boot-autoconfigure:3.3.2"
spring-boot-starter-data-jpa = "org.springframework.boot:spring-boot-starter-data-jpa:3.3.2"
spring-boot-starter-security = "org.springframework.boot:spring-boot-starter-security:3.3.2"
spring-boot-starter-test = "org.springframework.boot:spring-boot-starter-test:3.3.2"

database-influxdb = "org.influxdb:influxdb-java:2.24"

hikari = 'com.zaxxer:HikariCP:5.0.1'
rabbitmq = 'com.rabbitmq:amqp-client:5.19.0'
mqtt = 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
postgresql = "org.postgresql:postgresql:42.7.3"
spring-doc = "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0"

junit-jupiter-api = "org.junit.jupiter:junit-jupiter-api:5.9.3"
junit-jupiter-engine = "org.junit.jupiter:junit-jupiter-engine:5.9.3"

test-containers = "org.testcontainers:testcontainers:1.20.0"
test-containers-junit = "org.testcontainers:junit-jupiter:1.20.0"
test-containers-influxdb = "org.testcontainers:influxdb:1.20.0"
test-containers-postgres = "org.testcontainers:postgresql:1.20.0"
test-containers-rabbitmq = "org.testcontainers:rabbitmq:1.20.0"

[plugins]
lombok = "io.freefair.lombok:8.1.0"
spring = "org.springframework.boot:3.3.2"
dependencymanagement = "io.spring.dependency-management:1.1.2"
owasp = "org.owasp.dependencycheck:9.0.10"