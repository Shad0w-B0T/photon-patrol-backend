import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
  alias(libs.plugins.spring)
}

apply plugin: libs.plugins.dependencymanagement.get().pluginId
apply plugin: libs.plugins.spring.get().pluginId

ext {
  driverClass = "de.hdm.photon.pseudo.Driver"
}

dependencies {
  implementation project(":photon-schema")

  //Spring
  implementation libs.spring.boot.starter.parent
  implementation libs.spring.boot.autoconfigure
  implementation libs.mqtt
}

dependencyManagement {
  imports {
    mavenBom(SpringBootPlugin.BOM_COORDINATES)
  }
}

springBoot {
  mainClass = "${driverClass}"

  bootJar {
    archiveFileName.set("build.jar")
  }
  buildInfo()
}


jar {
  dependsOn(":photon-schema:build")
  manifest {
    attributes "Main-Class": "${driverClass}"
  }

  from {
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }

  //exclude("META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA")
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}


test {
  useJUnitPlatform()
}