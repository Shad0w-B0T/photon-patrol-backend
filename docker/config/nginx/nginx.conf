events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://192.168.2.245:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /device {
            proxy_pass http://192.168.2.245:5173/device;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /device/ {
            rewrite ^/device/(.*) /device/$1 break;
            proxy_pass http://192.168.2.245:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api {
            proxy_pass http://192.168.2.245:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}